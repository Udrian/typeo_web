name: Publish container image

# Builds the TypeO.Web container image and pushes it to GitHub Container Registry:
# - on every push to main/develop,
# - after "Update module documentation" commits new docs (its push uses GITHUB_TOKEN,
#   which does not trigger push workflows, hence the workflow_run trigger),
# - manually via workflow_dispatch.

on:
  push:
    branches: [main, develop]
  workflow_run:
    workflows: ["Update module documentation"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For workflow_run, check out the branch tip so the freshly committed docs are included.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/udrian/typeo-web:latest
