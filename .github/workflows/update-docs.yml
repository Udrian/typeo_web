name: Update module documentation

# Regenerates API documentation for newly tagged module versions:
# - repository_dispatch "module-release": sent by a module repository when a version tag is pushed
#   (see docs/notify-website-on-tag.yml for the workflow to add to module repositories)
# - workflow_dispatch: run manually, optionally for a single module
# - schedule: daily fallback so new tags are picked up even without a dispatch

on:
  repository_dispatch:
    types: [module-release]
  workflow_dispatch:
    inputs:
      module:
        description: "Only update a single module (name or repository, optional)"
        required: false
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install typer requirements
        run: pip install requests

      - name: Generate documentation for new module versions
        env:
          MODULE: ${{ github.event.client_payload.module || inputs.module || '' }}
        run: |
          EXTRA=""
          if [ -n "$MODULE" ]; then EXTRA="--module $MODULE"; fi
          dotnet run --project src/TypeO.Web.DocGen -c Release -- update \
            --modules src/TypeO.Web/modules.json \
            --output src/TypeO.Web/wwwroot/docs-data \
            --work "$RUNNER_TEMP/typeo-docgen" \
            $EXTRA

      - name: Commit updated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TypeO.Web/wwwroot/docs-data
          if git diff --cached --quiet; then
            echo "No new documentation."
          else
            git commit -m "docs: update generated module documentation"
            git push
          fi
