# Dockge stack for the TypeO homepage (typeo.typedeaf.com).
# Paste this compose file into a new Dockge stack (e.g. "typeo-web") on the server.
#
# The image is published to GitHub Container Registry by .github/workflows/publish-image.yml
# on every push (including the automatic documentation updates). To deploy a new version,
# just pull + restart the stack from the Dockge UI.
#
# If the ghcr.io package is private, log the server in first:
#   docker login ghcr.io -u <github-user> -p <token with read:packages>

services:
  typeo-web:
    image: ghcr.io/udrian/typeo-web:latest
    # Alternative without a registry: build straight from the GitHub repository instead
    # of pulling the image (comment out "image:" above and uncomment the next line):
    # build: https://github.com/Udrian/typeo_web.git#develop
    container_name: typeo-web
    restart: unless-stopped
    ports:
      # host:container - point the reverse proxy for typeo.typedeaf.com at this port.
      - "8080:8080"
    environment:
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
